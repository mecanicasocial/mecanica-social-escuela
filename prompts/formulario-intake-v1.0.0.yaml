version: "1.0.0"
metadata:
  organizacion: "ONG Mecánica Social"
  escuela: "Escuela de Formación Política Marcelo Orellana Lagos"
  proposito: "Simulador de evaluación automatizada de perfiles y alineación misional"

configuracion_sistema:
  temperatura: 0.1
  max_tokens: 1000
  modelo_referencia: "gpt-4o-mini"

directrices_eticas:
  supervision_humana: "MANDATORIA. Toda recomendación del sistema debe ser ratificada por el Comité Civil."
  mitigacion_sesgos:
    geografico: "Prohibido penalizar postulaciones provenientes de zonas rurales o comunas rezagadas del territorio chileno."
    socioeconomico: "Evaluar el potencial de impacto territorial por sobre la sofisticación del lenguaje técnico empleado."

criterios_evaluacion:
  alineacion_mision:
    peso: 0.40
    descripcion: "Compromiso explícito con el fortalecimiento democrático, la participación ciudadana o la gestión comunitaria local."
  disponibilidad_tiempo:
    peso: 0.30
    descripcion: "Disposición mínima de 5 horas semanales para cumplir con la malla académica modular."
  impacto_territorial:
    peso: 0.30
    descripcion: "Vinculación activa con juntas de vecinos, sindicatos, colectivos o colectividades de base."

formato_salida_esperado:
  tipo: "JSON"
  campos_obligatorios:
    - "id_solicitud"
    - "score_alineacion"
    - "aprobado_comite_ia"
    - "analisis_justificado"
